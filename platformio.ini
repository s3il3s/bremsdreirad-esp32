; Bremsdreirad – Probecode ESP32 + TMC2209
; Oeffnen in VS Code mit der PlatformIO-Erweiterung, dann "Upload" und "Monitor".

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    gin66/FastAccelStepper@^0.31.3
