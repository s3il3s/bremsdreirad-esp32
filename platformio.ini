; Bremsdreirad – ESP32 + TMC2209
; Oeffnen in VS Code mit der PlatformIO-Erweiterung.
; Unten in der Statusleiste die Umgebung waehlen:
;   env:esp32dev   = eigentliches Programm (mit Hallsensoren, Bremslauf, Log)
;   env:motortest  = nur Motor ueber WLAN testen, keine Sensoren noetig
; dann "Upload" und "Monitor".

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    gin66/FastAccelStepper

[env:esp32dev]
build_src_filter = +<*> -<motortest.cpp>

[env:motortest]
build_src_filter = +<motortest.cpp>
